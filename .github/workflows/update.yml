# Tính lại tín hiệu mỗi 10 phút trong phiên và sau giờ đóng cửa (thứ 2–6), rồi đăng lên GitHub Pages.
name: Cập nhật tín hiệu
on:
  schedule:
    - cron: "*/10 2-7 * * 1-5"   # mỗi 10 phút trong phiên 9:00–14:59 giờ VN
    - cron: "45 8 * * 1-5"       # bản chốt sau giờ đóng cửa
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python engine/build.py
      - name: Lưu bản dữ liệu vào nhánh data
        run: |
          cd web/data
          git init -q -b data
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Dữ liệu $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
      - name: Đóng gói trang
        run: |
          mkdir -p _site/data
          { echo '<!doctype html><html lang="vi"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>'; cat web/index.html; echo '</body></html>'; } > _site/index.html
          cp -r web/data/. _site/data/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
